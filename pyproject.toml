[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "basetype-benchmark"
version = "0.1.0"
description = "Benchmark comparatif des paradigmes de bases de données pour données bâtimentaires"
authors = [
    {name = "Synaptikad", email = "contact@synaptikad.com"}
]
dependencies = [
    # Core V3 (2025 stack)
    "pydantic>=2.5",
    "typer>=0.12",
    "rich>=13.0",
    "polars>=0.20",
    "pyarrow>=15.0",
    "pyyaml>=6.0",
    # Database drivers
    "psycopg[binary]>=3.2",
    "neo4j>=5.0.0",
    "httpx>=0.27",
    # Monitoring
    "docker>=7.0",
    "psutil>=5.9",
    # Legacy (for dataset generator)
    "requests>=2.28.0",
    "pandas>=1.5.0",
    "numpy>=1.21.0",
    "matplotlib>=3.5.0",
    "seaborn>=0.11.0",
    "tqdm>=4.64.0",
    "huggingface_hub>=0.20.0",
]
requires-python = ">=3.10"
readme = "README.md"
license = {text = "MIT"}

[project.scripts]
# V3 Runner CLI
btb-runner = "basetype_benchmark.runner.cli:app"
# Legacy scripts
basetype-dataset = "basetype_benchmark.dataset.run:main"
basetype-dataset-v2 = "basetype_benchmark.dataset.run_v2:main"
basetype-dataset-interactive = "basetype_benchmark.dataset.run_v2:interactive"
basetype-benchmark = "basetype_benchmark.benchmark.runner:main"
basetype-cli = "basetype_benchmark.cli:cli_main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["basetype_benchmark*"]

[tool.setuptools.package-dir]
"" = "src"