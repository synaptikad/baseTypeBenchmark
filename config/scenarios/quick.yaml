# Scenario: Quick Test
# Purpose: Fast validation before full benchmark
# Duration: ~10 minutes

name: Quick Test
description: Fast validation with minimal paradigms and queries

paradigms:
  - P1   # SQL baseline (PostgreSQL Relational)
  - M1   # Graph native baseline (Memgraph Standalone)

queries:
  - Q1   # Graph traversal (FEEDS chain)
  - Q6   # Timeseries aggregation
  - Q8   # Hybrid (equipment + TS)

dataset:
  profile: small

ram_gradient:
  levels_gb: [32, 16, 8]

execution:
  warmup_runs: 1
  timed_runs: 3
  variants: 1
  timeout_seconds: 60

options:
  cleanup_exports: true
  stop_on_oom: false
