# Dashboard-only workload - Q1-Q5 (pure graph traversal)
# Usage: Test graph engine performance without timeseries

workload:
  name: dashboard_only
  description: "50 dashboard queries (Q1-Q5) - pure graph traversal"
  version: "1.0"

metrics:
  strategy: per_query

execution:
  mode: iterations
  iterations: 50
  concurrency: 1
  warmup_iterations: 3

queries:
  - id: Q1
    weight: 30
    category: dashboard
  - id: Q2
    weight: 25
    category: dashboard
  - id: Q3
    weight: 20
    category: dashboard
  - id: Q4
    weight: 15
    category: dashboard
  - id: Q5
    weight: 10
    category: dashboard

selection:
  strategy: weighted_random
  seed: 123
