# Mixed realistic workload - all Q1-Q13 weighted
# Usage: Balanced test of entire query portfolio

workload:
  name: mixed_realistic
  description: "50 mixed queries (Q1-Q13) - balanced workload"
  version: "1.0"

metrics:
  strategy: aggregate

execution:
  mode: iterations
  iterations: 50
  concurrency: 1
  warmup_iterations: 3

queries:
  # Dashboard (50% of traffic)
  - id: Q1
    weight: 15
    category: dashboard
  - id: Q2
    weight: 12
    category: dashboard
  - id: Q3
    weight: 10
    category: dashboard
  - id: Q4
    weight: 8
    category: dashboard
  - id: Q5
    weight: 5
    category: dashboard

  # Real-time (15% of traffic)
  - id: Q6
    weight: 15
    category: realtime

  # Analytics (30% of traffic)
  - id: Q7
    weight: 8
    category: analytics
  - id: Q8
    weight: 6
    category: analytics
  - id: Q9
    weight: 5
    category: analytics
  - id: Q10
    weight: 4
    category: analytics
  - id: Q11
    weight: 4
    category: analytics
  - id: Q12
    weight: 3
    category: analytics

  # Reports (5% of traffic)
  - id: Q13
    weight: 5
    category: report

selection:
  strategy: weighted_random
  seed: 2024
