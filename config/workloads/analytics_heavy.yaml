# Analytics-heavy workload - focus Q6-Q12 (hybrid queries)
# Usage: Test performance of analytics/timeseries joins

workload:
  name: analytics_heavy
  description: "50 analytics queries (Q6-Q12) - hybrid graph+timeseries"
  version: "1.0"

metrics:
  strategy: aggregate

execution:
  mode: iterations
  iterations: 50
  concurrency: 1
  warmup_iterations: 3

queries:
  - id: Q6
    weight: 20
    category: realtime
  - id: Q7
    weight: 15
    category: analytics
  - id: Q8
    weight: 15
    category: analytics
  - id: Q9
    weight: 10
    category: analytics
  - id: Q10
    weight: 10
    category: analytics
  - id: Q11
    weight: 10
    category: analytics
  - id: Q12
    weight: 20
    category: analytics

selection:
  strategy: weighted_random
  seed: 456
