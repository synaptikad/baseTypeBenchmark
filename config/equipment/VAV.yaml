# VAV - Variable Air Volume Box (Boîte à débit variable)
# 18 points

equipment:
  code: VAV
  domain: HVAC
  haystack: vav
  brick: Variable_Air_Volume_Box
  protocols: [bacnet, lon, modbus]

points:
  # === TEMPÉRATURE ===
  - id: zone_temp
    type: mesure
    freq: normal
    unit: "°C"
    quantity: temperature
    desc: Température zone
    bacnet: "AI:1"
    modbus: "40001"

  - id: zone_temp_sp
    type: cmd
    freq: event
    unit: "°C"
    desc: Consigne température zone
    bacnet: "AV:1"
    modbus: "40101"

  - id: discharge_temp
    type: mesure
    freq: normal
    unit: "°C"
    quantity: temperature
    desc: Température soufflage (après batterie)
    bacnet: "AI:2"
    modbus: "40002"

  # === DÉBIT D'AIR ===
  - id: airflow
    type: mesure
    freq: fast
    unit: m3/h
    quantity: flow
    desc: Débit d'air mesuré
    bacnet: "AI:3"
    modbus: "40003"

  - id: airflow_sp
    type: cmd
    freq: event
    unit: m3/h
    desc: Consigne débit d'air
    bacnet: "AV:2"
    modbus: "40102"

  - id: airflow_min
    type: mesure
    freq: slow
    unit: m3/h
    quantity: flow
    desc: Débit minimum configuré
    bacnet: "AV:3"
    modbus: "40103"

  - id: airflow_max
    type: mesure
    freq: slow
    unit: m3/h
    quantity: flow
    desc: Débit maximum configuré
    bacnet: "AV:4"
    modbus: "40104"

  # === VOLET / DAMPER ===
  - id: damper_position
    type: mesure
    freq: fast
    unit: "%"
    quantity: position
    desc: Position volet
    bacnet: "AI:4"
    modbus: "40004"

  - id: damper_cmd
    type: cmd
    freq: event
    unit: "%"
    desc: Commande volet
    bacnet: "AO:1"
    modbus: "40201"

  # === BATTERIE DE RÉCHAUFFAGE ===
  - id: reheat_valve_pos
    type: mesure
    freq: fast
    unit: "%"
    quantity: position
    desc: Position vanne réchauffage
    bacnet: "AI:5"
    modbus: "40005"

  - id: reheat_valve_cmd
    type: cmd
    freq: event
    unit: "%"
    desc: Commande vanne réchauffage
    bacnet: "AO:2"
    modbus: "40202"

  - id: reheat_output
    type: mesure
    freq: fast
    unit: "%"
    desc: Sortie contrôleur réchauffage
    bacnet: "AV:5"
    modbus: "40105"

  # === OCCUPATION ===
  - id: occupancy
    type: etat
    freq: event
    values: [occupied, unoccupied, standby]
    desc: État occupation zone
    bacnet: "MSV:1"
    modbus: "40301"

  - id: occupancy_override
    type: cmd
    freq: event
    desc: Forçage occupation
    bacnet: "BV:1"
    modbus: "00001"

  # === MODE / ÉTAT ===
  - id: operating_mode
    type: etat
    freq: event
    values: [heating, cooling, deadband, off]
    desc: Mode actif
    bacnet: "MSV:2"
    modbus: "40302"

  - id: run_status
    type: etat
    freq: event
    desc: En fonctionnement
    bacnet: "BI:1"
    modbus: "10001"

  # === ALARMES ===
  - id: low_airflow_alarm
    type: alarme
    freq: event
    desc: Débit insuffisant
    bacnet: "BI:2"
    modbus: "10002"

  - id: damper_fault
    type: alarme
    freq: event
    desc: Défaut volet (bloqué)
    bacnet: "BI:3"
    modbus: "10003"
