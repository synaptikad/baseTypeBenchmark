# Catalog des 23 Queries - Benchmark BaseType V3
# Source de vérité pour les intentions de requêtes
# Généré par AGENT-B

version: "3.0"
generated: "2025-01-06"

# ===========================================================================
# CATEGORIES
# ===========================================================================
categories:
  graph_only:
    description: "Traversées structurelles pures"
    queries: [Q1, Q2, Q3, Q4, Q5]
  timeseries_pure:
    description: "Agrégations temporelles directes"
    queries: [Q6]
  hybrid:
    description: "Sélection graph + agrégation timeseries"
    queries: [Q7, Q8, Q9, Q12, Q13]
  jsonb_specific:
    description: "Requêtes exploitant les propriétés JSONB (P2=NATIVE)"
    queries: [Q14, Q15, Q16, Q17, Q18, Q19]
  graph_native:
    description: "Algorithmes graphe natifs (M1/M2=NATIVE)"
    queries: [Q10, Q11, Q20, Q21, Q22, Q23, Q27, Q28, Q29, Q30]
  sql_native:
    description: "Fonctionnalités SQL avancées (P1/P2=NATIVE)"
    queries: [Q31, Q32, Q33, Q34]
  write_workload:
    description: "Workloads d'écriture (ingestion, mutation)"
    queries: [QW1, QW2, QW3]
  jsonb_write:
    description: "Écritures JSONB avancées (P2=NATIVE)"
    queries: [QW4, QW5, QW6, QW7, QW8]
  jsonb_validation:
    description: "Lectures enrichies post-écriture (P2=NATIVE)"
    queries: [Q24, Q25, Q26]
  write_validation:
    description: "Lectures de validation des écritures QW (post-write checks)"
    queries: [Q35, Q36, Q37, Q38]

# ===========================================================================
# QUERIES
# ===========================================================================
queries:

  # -------------------------------------------------------------------------
  # GRAPH-ONLY (Q1-Q5)
  # -------------------------------------------------------------------------

  Q1:
    name: "Energy Chain"
    category: graph_only
    intention: |
      Depuis un compteur principal (MainMeter), trouver tous les équipements
      alimentés en suivant la chaîne FEEDS, jusqu'à une profondeur max de 10.
    use_case: "Analyse d'impact en cas de coupure électrique"
    parameters:
      - name: METER_ID
        type: string
        description: "ID d'un MainMeter existant"
        format:
          sql: "$1"
          cypher: "$meter_id"
          sparql: "?meterId"
        example: "meter_main_1"
    relations: [FEEDS]
    max_depth: 10
    direction: downstream
    result_schema:
      columns:
        - {name: id, type: string, description: "ID équipement"}
        - {name: type, type: string, description: "Type de nœud"}
        - {name: name, type: string, description: "Nom équipement"}
        - {name: depth, type: integer, description: "Profondeur dans la chaîne"}
      order_by: [depth, id]
    paradigm_status:
      P1: {status: NATIVE, note: "CTE récursif"}
      P2: {status: NATIVE, note: "CTE récursif"}
      M1: {status: NATIVE, note: "Pattern FEEDS*1..10"}
      M2: {status: NATIVE, note: "Pattern FEEDS*1..10"}
      O2: {status: NATIVE, note: "Property path btb:feeds+"}

  Q2:
    name: "Functional Impact"
    category: graph_only
    intention: |
      Depuis un équipement en panne, remonter la chaîne pour trouver les
      équipements parents affectés via FEEDS, SERVES, CONTAINS (traversée inverse).
    use_case: "Diagnostic de panne, analyse de dépendances"
    parameters:
      - name: EQUIPMENT_ID
        type: string
        description: "ID d'un équipement existant"
        format:
          sql: "$1"
          cypher: "$equipment_id"
          sparql: "?equipmentId"
        example: "equip_ahu_1"
    relations: [FEEDS, SERVES, CONTAINS]
    max_depth: 10
    direction: upstream
    result_schema:
      columns:
        - {name: id, type: string, description: "ID équipement parent"}
        - {name: type, type: string, description: "Type de nœud"}
        - {name: name, type: string, description: "Nom équipement"}
        - {name: relation_type, type: string, description: "Type de relation"}
        - {name: depth, type: integer, description: "Profondeur dans la chaîne"}
      order_by: [depth, id]
    paradigm_status:
      P1: {status: NATIVE, note: "CTE récursif avec UNION sur relations"}
      P2: {status: NATIVE, note: "CTE récursif avec UNION sur relations"}
      M1: {status: NATIVE, note: "Pattern [:FEEDS|SERVES|CONTAINS*]"}
      M2: {status: NATIVE, note: "Pattern [:FEEDS|SERVES|CONTAINS*]"}
      O2: {status: NATIVE, note: "Property path avec alternatives"}

  Q3:
    name: "Space Services"
    category: graph_only
    intention: |
      Pour un espace donné, lister tous les équipements qui le desservent,
      le contiennent, ou le surveillent.
    use_case: "Inventaire équipements d'une salle de réunion"
    parameters:
      - name: SPACE_ID
        type: string
        description: "ID d'un espace existant"
        format:
          sql: "$1"
          cypher: "$space_id"
          sparql: "?spaceId"
        example: "space_meeting_101"
    relations: [SERVES, CONTAINS, LOCATED_IN, MONITORS]
    direction: incoming
    result_schema:
      columns:
        - {name: equipment_id, type: string, description: "ID équipement"}
        - {name: equipment_name, type: string, description: "Nom équipement"}
        - {name: equipment_type, type: string, description: "Type équipement"}
        - {name: relation_type, type: string, description: "Type de relation"}
      order_by: [relation_type, equipment_id]
    paradigm_status:
      P1: {status: NATIVE, note: "JOIN sur edges avec filtre rel_type"}
      P2: {status: NATIVE, note: "JOIN sur edges avec filtre rel_type"}
      M1: {status: NATIVE, note: "Pattern multi-relations"}
      M2: {status: NATIVE, note: "Pattern multi-relations"}
      O2: {status: NATIVE, note: "UNION de patterns SPARQL"}

  Q4:
    name: "Floor Temperature Inventory"
    category: graph_only
    intention: |
      Pour un étage, lister tous les points de mesure de température avec
      leur équipement parent.
    use_case: "Vérification couverture capteurs pour confort thermique"
    parameters:
      - name: FLOOR_ID
        type: string
        description: "ID d'un étage existant"
        format:
          sql: "$1"
          cypher: "$floor_id"
          sparql: "?floorId"
        example: "floor_b1_02"
    relations: [CONTAINS, SERVES, HAS_POINT]
    filters:
      - property: quantity
        value: "temperature"
    result_schema:
      columns:
        - {name: floor_id, type: string, description: "ID étage"}
        - {name: point_id, type: string, description: "ID point de mesure"}
        - {name: point_name, type: string, description: "Nom point"}
        - {name: equipment_id, type: string, description: "ID équipement parent"}
        - {name: equipment_name, type: string, description: "Nom équipement"}
      order_by: [equipment_id, point_id]
    paradigm_status:
      P1: {status: NATIVE, note: "Multi-JOIN avec filtre quantity"}
      P2: {status: NATIVE, note: "Multi-JOIN avec filtre quantity"}
      M1: {status: NATIVE, note: "Pattern traversée + WHERE"}
      M2: {status: NATIVE, note: "Pattern traversée + WHERE"}
      O2: {status: NATIVE, note: "Property path + FILTER"}

  Q5:
    name: "Orphans"
    category: graph_only
    intention: |
      Trouver les équipements sans aucune relation (pas de FEEDS, SERVES,
      CONTAINS, LOCATED_IN, etc.).
    use_case: "Audit qualité données, détection erreurs d'import"
    parameters: []
    relations: []
    result_schema:
      columns:
        - {name: id, type: string, description: "ID équipement orphelin"}
        - {name: type, type: string, description: "Type équipement"}
        - {name: name, type: string, description: "Nom équipement"}
      order_by: [type, id]
    paradigm_status:
      P1: {status: NATIVE, note: "LEFT JOIN edges IS NULL"}
      P2: {status: NATIVE, note: "LEFT JOIN edges IS NULL"}
      M1: {status: NATIVE, note: "MATCH (e:Equipment) WHERE NOT (e)--()"}
      M2: {status: NATIVE, note: "MATCH (e:Equipment) WHERE NOT (e)--()"}
      O2: {status: NATIVE, note: "FILTER NOT EXISTS"}

  # -------------------------------------------------------------------------
  # TIMESERIES PURE (Q6)
  # -------------------------------------------------------------------------

  Q6:
    name: "Hourly Aggregation"
    category: timeseries_pure
    intention: |
      Pour un point donné, calculer les agrégats horaires (avg, min, max)
      sur une période.
    use_case: "Courbe de charge, analyse consommation"
    parameters:
      - name: POINT_ID
        type: string
        description: "ID d'un point de mesure"
        format:
          sql: "$1"
          cypher: "$point_id"
          sparql: "?pointId"
        example: "point_temp_101"
      - name: DATE_START
        type: timestamp
        description: "Début de période"
        format:
          sql: "$2"
          cypher: "$date_start"
          sparql: "?dateStart"
        example: "2024-01-01T00:00:00Z"
      - name: DATE_END
        type: timestamp
        description: "Fin de période"
        format:
          sql: "$3"
          cypher: "$date_end"
          sparql: "?dateEnd"
        example: "2024-01-31T23:59:59Z"
    result_schema:
      columns:
        - {name: hour_bucket, type: timestamp, description: "Bucket horaire"}
        - {name: avg_value, type: float, description: "Moyenne"}
        - {name: min_value, type: float, description: "Minimum"}
        - {name: max_value, type: float, description: "Maximum"}
        - {name: sample_count, type: integer, description: "Nombre d'échantillons"}
      order_by: [hour_bucket]
    paradigm_status:
      P1: {status: NATIVE, note: "time_bucket + agrégats TimescaleDB"}
      P2: {status: NATIVE, note: "time_bucket + agrégats TimescaleDB"}
      M1: {status: DEGRADED, note: "UNWIND sur TimeseriesChunk (daily chunks)"}
      M2: {status: NATIVE, note: "TimescaleDB via extension"}
      O2: {status: DEGRADED, note: "Agrégation SPARQL limitée"}

  # -------------------------------------------------------------------------
  # HYBRID (Q7-Q13)
  # -------------------------------------------------------------------------

  Q7:
    name: "Drift Top-20"
    category: hybrid
    intention: |
      Trouver les 20 points avec la plus grande variance sur une période.
    use_case: "Détection anomalies, maintenance prédictive"
    parameters:
      - name: BUILDING_ID
        type: string
        description: "ID d'un bâtiment"
        format:
          sql: "$1"
          cypher: "$building_id"
          sparql: "?buildingId"
        example: "building_hq_1"
      - name: DATE_START
        type: timestamp
        description: "Début de période"
        format:
          sql: "$2"
          cypher: "$date_start"
          sparql: "?dateStart"
        example: "2024-01-01T00:00:00Z"
      - name: DATE_END
        type: timestamp
        description: "Fin de période"
        format:
          sql: "$3"
          cypher: "$date_end"
          sparql: "?dateEnd"
        example: "2024-01-31T23:59:59Z"
    result_schema:
      columns:
        - {name: point_id, type: string, description: "ID point"}
        - {name: point_name, type: string, description: "Nom point"}
        - {name: variance, type: float, description: "Variance calculée"}
        - {name: avg_value, type: float, description: "Moyenne"}
        - {name: sample_count, type: integer, description: "Nombre d'échantillons"}
      order_by: [variance DESC]
      limit: 20
    paradigm_status:
      P1: {status: NATIVE, note: "JOIN nodes + TimescaleDB variance"}
      P2: {status: NATIVE, note: "JOIN nodes + TimescaleDB variance"}
      M1: {status: DEGRADED, note: "UNWIND + stDev sur TimeseriesChunk"}
      M2: {status: NATIVE, note: "Cypher + TimescaleDB"}
      O2: {status: DEGRADED, note: "SPARQL agrégation limitée"}

  Q8:
    name: "Tenant Energy"
    category: hybrid
    intention: |
      Calculer la consommation totale d'un locataire via ses sous-compteurs.
    use_case: "Facturation énergie, reporting RE2020"
    parameters:
      - name: TENANT_ID
        type: string
        description: "ID d'un locataire"
        format:
          sql: "$1"
          cypher: "$tenant_id"
          sparql: "?tenantId"
        example: "tenant_acme_corp"
      - name: DATE_START
        type: timestamp
        description: "Début de période"
        format:
          sql: "$2"
          cypher: "$date_start"
          sparql: "?dateStart"
        example: "2024-01-01T00:00:00Z"
      - name: DATE_END
        type: timestamp
        description: "Fin de période"
        format:
          sql: "$3"
          cypher: "$date_end"
          sparql: "?dateEnd"
        example: "2024-01-31T23:59:59Z"
    relations: [METERS_TENANT, HAS_POINT]
    filters:
      - property: quantity
        value: "energy"
    result_schema:
      columns:
        - {name: tenant_id, type: string, description: "ID locataire"}
        - {name: total_energy_kwh, type: float, description: "Énergie totale kWh"}
        - {name: meter_count, type: integer, description: "Nombre de compteurs"}
        - {name: point_count, type: integer, description: "Nombre de points"}
      order_by: []
    paradigm_status:
      P1: {status: NATIVE, note: "Graph JOIN + SUM timeseries"}
      P2: {status: NATIVE, note: "Graph JOIN + SUM timeseries"}
      M1: {status: DEGRADED, note: "UNWIND + SUM sur TimeseriesChunk"}
      M2: {status: NATIVE, note: "Cypher traversée + TimescaleDB"}
      O2: {status: DEGRADED, note: "SPARQL + agrégation externe"}

  Q9:
    name: "Tenant Carbon Footprint"
    category: hybrid
    intention: |
      Calculer l'empreinte carbone d'un locataire (énergie × facteur CO2).
    use_case: "Reporting RSE, conformité réglementaire"
    parameters:
      - name: TENANT_ID
        type: string
        description: "ID d'un locataire"
        format:
          sql: "$1"
          cypher: "$tenant_id"
          sparql: "?tenantId"
        example: "tenant_acme_corp"
      - name: DATE_START
        type: timestamp
        description: "Début de période"
        format:
          sql: "$2"
          cypher: "$date_start"
          sparql: "?dateStart"
        example: "2024-01-01T00:00:00Z"
      - name: DATE_END
        type: timestamp
        description: "Fin de période"
        format:
          sql: "$3"
          cypher: "$date_end"
          sparql: "?dateEnd"
        example: "2024-01-31T23:59:59Z"
      - name: CO2_FACTOR
        type: float
        description: "Facteur de conversion kgCO2/kWh"
        format:
          sql: "$4"
          cypher: "$co2_factor"
          sparql: "?co2Factor"
        example: 0.0569
        default: 0.0569
    relations: [METERS_TENANT, HAS_POINT]
    filters:
      - property: quantity
        value: "energy"
    result_schema:
      columns:
        - {name: tenant_id, type: string, description: "ID locataire"}
        - {name: total_energy_kwh, type: float, description: "Énergie totale kWh"}
        - {name: carbon_kg_co2, type: float, description: "Empreinte carbone kgCO2"}
      order_by: []
    paradigm_status:
      P1: {status: NATIVE, note: "Extension Q8 avec multiplication"}
      P2: {status: NATIVE, note: "Extension Q8 avec multiplication"}
      M1: {status: DEGRADED, note: "UNWIND + SUM × CO2 factor sur TimeseriesChunk"}
      M2: {status: NATIVE, note: "Cypher + TimescaleDB + calcul"}
      O2: {status: DEGRADED, note: "SPARQL + calcul externe"}

  Q10:
    name: "Security Access Analysis"
    category: graph_native
    intention: |
      Pour un bâtiment, lister les équipements de sécurité (badges, caméras)
      par espace avec leur couverture.
    use_case: "Audit sécurité, plan d'évacuation"
    parameters:
      - name: BUILDING_ID
        type: string
        description: "ID d'un bâtiment"
        format:
          sql: "$1"
          cypher: "$building_id"
          sparql: "?buildingId"
        example: "building_hq_1"
    relations: [MONITORS, LOCATED_IN, CONTAINS]
    filters:
      - property: equipment_type
        values: ["BadgeReader", "IPCamera", "DoorContact", "PIRDetector"]
    result_schema:
      columns:
        - {name: space_id, type: string, description: "ID espace"}
        - {name: space_name, type: string, description: "Nom espace"}
        - {name: equipment_type, type: string, description: "Type équipement sécurité"}
        - {name: equipment_count, type: integer, description: "Nombre d'équipements"}
      order_by: [space_id, equipment_type]
    paradigm_status:
      P1: {status: NATIVE, note: "JOIN + GROUP BY"}
      P2: {status: NATIVE, note: "JOIN + GROUP BY"}
      M1: {status: NATIVE, note: "Pattern + count()"}
      M2: {status: NATIVE, note: "Pattern + count()"}
      O2: {status: NATIVE, note: "SPARQL GROUP BY + COUNT"}

  Q11:
    name: "IT Infrastructure Impact"
    category: graph_native
    intention: |
      Trouver les serveurs dépendant d'une alimentation spécifique (UPS, circuit).
    use_case: "Planification maintenance, analyse risque"
    parameters:
      - name: UPS_ID
        type: string
        description: "ID d'un UPS ou circuit électrique"
        format:
          sql: "$1"
          cypher: "$ups_id"
          sparql: "?upsId"
        example: "equip_ups_dc_1"
    relations: [FEEDS]
    filters:
      - property: equipment_type
        values: ["RackServer", "NetworkSwitch", "StorageArray"]
    max_depth: 5
    direction: downstream
    result_schema:
      columns:
        - {name: equipment_id, type: string, description: "ID équipement IT"}
        - {name: equipment_name, type: string, description: "Nom équipement"}
        - {name: equipment_type, type: string, description: "Type équipement"}
        - {name: depth, type: integer, description: "Distance depuis UPS"}
      order_by: [depth, equipment_type, equipment_id]
    paradigm_status:
      P1: {status: NATIVE, note: "CTE récursif + filtre type"}
      P2: {status: NATIVE, note: "CTE récursif + filtre type"}
      M1: {status: NATIVE, note: "Pattern FEEDS* + WHERE"}
      M2: {status: NATIVE, note: "Pattern FEEDS* + WHERE"}
      O2: {status: NATIVE, note: "Property path + FILTER"}

  Q12:
    name: "Full Building Analytics"
    category: hybrid
    intention: |
      Agrégation multi-domaine pour un bâtiment (énergie totale, confort moyen,
      occupation).
    use_case: "Dashboard direction, reporting mensuel"
    parameters:
      - name: BUILDING_ID
        type: string
        description: "ID d'un bâtiment"
        format:
          sql: "$1"
          cypher: "$building_id"
          sparql: "?buildingId"
        example: "building_hq_1"
      - name: DATE_START
        type: timestamp
        description: "Début de période"
        format:
          sql: "$2"
          cypher: "$date_start"
          sparql: "?dateStart"
        example: "2024-01-01T00:00:00Z"
      - name: DATE_END
        type: timestamp
        description: "Fin de période"
        format:
          sql: "$3"
          cypher: "$date_end"
          sparql: "?dateEnd"
        example: "2024-01-31T23:59:59Z"
    relations: [CONTAINS, HAS_POINT]
    filters:
      - property: quantity
        values: ["energy", "temperature", "occupancy"]
    result_schema:
      columns:
        - {name: building_id, type: string, description: "ID bâtiment"}
        - {name: total_energy_kwh, type: float, description: "Énergie totale kWh"}
        - {name: avg_temperature_c, type: float, description: "Température moyenne °C"}
        - {name: total_occupancy, type: integer, description: "Occupation cumulée"}
      order_by: []
    paradigm_status:
      P1: {status: NATIVE, note: "Multi-JOIN + agrégats par quantity"}
      P2: {status: NATIVE, note: "Multi-JOIN + agrégats par quantity"}
      M1: {status: DEGRADED, note: "UNWIND multi-agrégats sur TimeseriesChunk"}
      M2: {status: NATIVE, note: "Cypher + TimescaleDB multi-agrégats"}
      O2: {status: DEGRADED, note: "SPARQL + agrégation externe"}

  Q13:
    name: "Office Hours Comfort"
    category: hybrid
    intention: |
      Analyser le confort (température, CO2) dans les bureaux pendant les
      heures de travail (8h-18h, lun-ven).
    use_case: "Conformité bien-être au travail, optimisation CVC"
    parameters:
      - name: BUILDING_ID
        type: string
        description: "ID d'un bâtiment"
        format:
          sql: "$1"
          cypher: "$building_id"
          sparql: "?buildingId"
        example: "building_hq_1"
      - name: DATE_START
        type: timestamp
        description: "Début de période"
        format:
          sql: "$2"
          cypher: "$date_start"
          sparql: "?dateStart"
        example: "2024-01-01T00:00:00Z"
      - name: DATE_END
        type: timestamp
        description: "Fin de période"
        format:
          sql: "$3"
          cypher: "$date_end"
          sparql: "?dateEnd"
        example: "2024-01-31T23:59:59Z"
    relations: [CONTAINS, SERVES, HAS_POINT]
    filters:
      - property: space_type
        pattern: "office%"
      - property: quantity
        values: ["temperature", "co2"]
    time_filters:
      hours: [8, 18]
      days: [1, 5]  # Monday to Friday
    result_schema:
      columns:
        - {name: space_id, type: string, description: "ID espace bureau"}
        - {name: space_name, type: string, description: "Nom espace"}
        - {name: avg_temp_c, type: float, description: "Température moyenne °C"}
        - {name: avg_co2_ppm, type: float, description: "CO2 moyen ppm"}
        - {name: hours_out_of_range, type: integer, description: "Heures hors plage"}
      order_by: [hours_out_of_range DESC, space_id]
    paradigm_status:
      P1: {status: NATIVE, note: "JOIN + EXTRACT(hour/dow) + agrégats"}
      P2: {status: NATIVE, note: "JOIN + EXTRACT(hour/dow) + agrégats"}
      M1: {status: DEGRADED, note: "UNWIND + filtres temporels sur TimeseriesChunk"}
      M2: {status: NATIVE, note: "Cypher + TimescaleDB filtres temporels"}
      O2: {status: DEGRADED, note: "SPARQL filtres temporels limités"}

  # -------------------------------------------------------------------------
  # JSONB-SPECIFIC (Q14-Q19)
  # -------------------------------------------------------------------------

  Q14:
    name: "Protocol Query"
    category: jsonb_specific
    intention: |
      Trouver tous les points communiquant avec un device BACnet spécifique.
    use_case: "Diagnostic réseau BACnet, remplacement contrôleur, migration"
    parameters:
      - name: DEVICE_ID
        type: integer
        description: "ID du device BACnet"
        format:
          sql: "$1"
          cypher: "$device_id"
          sparql: "?deviceId"
        example: 1234
    jsonb_path: "data->'protocol'->>'device_id'"
    filters:
      - property: protocol.type
        value: "BACnet"
    result_schema:
      columns:
        - {name: point_id, type: string, description: "ID point"}
        - {name: point_name, type: string, description: "Nom point"}
        - {name: equipment_id, type: string, description: "ID équipement parent"}
        - {name: object_type, type: string, description: "Type objet BACnet"}
        - {name: object_instance, type: integer, description: "Instance objet BACnet"}
      order_by: [equipment_id, point_id]
    paradigm_status:
      P1: {status: IMPOSSIBLE, note: "Pas de colonne protocol"}
      P2: {status: NATIVE, note: "Index GIN sur data->'protocol'"}
      M1: {status: DEGRADED, note: "Si exporté comme propriété"}
      M2: {status: DEGRADED, note: "Si exporté comme propriété"}
      O2: {status: DEGRADED, note: "Triples multiples requis"}

  Q15:
    name: "Warranty Expiry"
    category: jsonb_specific
    intention: |
      Trouver les équipements dont la garantie expire dans les N prochains jours.
    use_case: "Planification renouvellement contrats, budget maintenance"
    parameters:
      - name: DAYS_AHEAD
        type: integer
        description: "Nombre de jours avant expiration"
        format:
          sql: "$1"
          cypher: "$days_ahead"
          sparql: "?daysAhead"
        example: 90
        default: 90
      - name: REFERENCE_DATE
        type: date
        description: "Date de référence pour le calcul"
        format:
          sql: "$2"
          cypher: "$reference_date"
          sparql: "?referenceDate"
        example: "2025-01-01"
        default: "2025-01-01"
    jsonb_path: "data->'metadata'->>'warranty_end'"
    result_schema:
      columns:
        - {name: equipment_id, type: string, description: "ID équipement"}
        - {name: name, type: string, description: "Nom équipement"}
        - {name: equipment_type, type: string, description: "Type équipement"}
        - {name: warranty_end, type: date, description: "Date fin garantie"}
        - {name: days_remaining, type: integer, description: "Jours restants"}
      order_by: [days_remaining, equipment_id]
    paradigm_status:
      P1: {status: IMPOSSIBLE, note: "Pas de colonne warranty"}
      P2: {status: NATIVE, note: "Opérateur ? + cast date"}
      M1: {status: DEGRADED, note: "Si exporté comme propriété"}
      M2: {status: DEGRADED, note: "Si exporté comme propriété"}
      O2: {status: DEGRADED, note: "Triple warranty_end requis"}

  Q16:
    name: "Semantic Tag Search"
    category: jsonb_specific
    intention: |
      Trouver les équipements correspondant à des tags Brick/Haystack.
    use_case: "Interopérabilité ontologies, recherche sémantique"
    parameters:
      - name: TAG_PATTERN
        type: string
        description: "Pattern regex pour filtrer les tags"
        format:
          sql: "$1"
          cypher: "$tag_pattern"
          sparql: "?tagPattern"
        example: "^brick:"
    jsonb_path: "data->'tags'"
    result_schema:
      columns:
        - {name: equipment_id, type: string, description: "ID équipement"}
        - {name: name, type: string, description: "Nom équipement"}
        - {name: matching_tags, type: array, description: "Tags correspondants"}
      order_by: [equipment_id]
    paradigm_status:
      P1: {status: IMPOSSIBLE, note: "Pas de colonne tags array"}
      P2: {status: NATIVE, note: "jsonb_array_elements_text + regex"}
      M1: {status: NATIVE, note: "MAGE json_util.from_json_list()"}
      M2: {status: NATIVE, note: "MAGE json_util.from_json_list()"}
      O2: {status: NATIVE, note: "Triples RDF naturels pour tags"}

  Q17:
    name: "Capability Filter"
    category: jsonb_specific
    intention: |
      Trouver les équipements HVAC ayant une capacité spécifique
      (humidity_control, variable_speed, etc.).
    use_case: "Audit technique, planification upgrade"
    parameters:
      - name: CAPABILITY
        type: string
        description: "Capacité recherchée"
        format:
          sql: "$1"
          cypher: "$capability"
          sparql: "?capability"
        example: "humidity_control"
    jsonb_path: "data->'capabilities'"
    result_schema:
      columns:
        - {name: equipment_id, type: string, description: "ID équipement"}
        - {name: name, type: string, description: "Nom équipement"}
        - {name: equipment_type, type: string, description: "Type équipement"}
        - {name: all_capabilities, type: array, description: "Toutes les capacités"}
      order_by: [equipment_type, equipment_id]
    paradigm_status:
      P1: {status: IMPOSSIBLE, note: "Pas de colonne array capabilities"}
      P2: {status: NATIVE, note: "Opérateur @> containment + GIN index"}
      M1: {status: NATIVE, note: "MAGE json_util.from_json_list()"}
      M2: {status: NATIVE, note: "MAGE json_util.from_json_list()"}
      O2: {status: DEGRADED, note: "Triples multiples requis"}

  Q18:
    name: "Calibration Chain"
    category: jsonb_specific
    intention: |
      Dans la chaîne énergétique, trouver les points dont la calibration
      est échue.
    use_case: "Planification métrologie, conformité"
    parameters:
      - name: METER_ID
        type: string
        description: "ID d'un compteur principal"
        format:
          sql: "$1"
          cypher: "$meter_id"
          sparql: "?meterId"
        example: "meter_main_1"
      - name: REFERENCE_DATE
        type: date
        description: "Date de référence pour le calcul du retard"
        format:
          sql: "$2"
          cypher: "$reference_date"
          sparql: "?referenceDate"
        example: "2025-01-01"
        default: "2025-01-01"
    relations: [FEEDS, HAS_POINT]
    jsonb_path: "data->'calibration'->>'next_date'"
    max_depth: 10
    result_schema:
      columns:
        - {name: point_id, type: string, description: "ID point"}
        - {name: point_name, type: string, description: "Nom point"}
        - {name: equipment_id, type: string, description: "ID équipement parent"}
        - {name: last_calibration, type: date, description: "Dernière calibration"}
        - {name: next_calibration, type: date, description: "Prochaine calibration"}
        - {name: days_overdue, type: integer, description: "Jours de retard"}
      order_by: [days_overdue DESC, point_id]
    paradigm_status:
      P1: {status: DEGRADED, note: "Pas de colonne calibration"}
      P2: {status: NATIVE, note: "CTE récursive + filtre calibration JSON"}
      M1: {status: DEGRADED, note: "Pattern + WHERE si exporté"}
      M2: {status: DEGRADED, note: "Pattern + WHERE si exporté"}
      O2: {status: DEGRADED, note: "Property path + FILTER"}

  Q19:
    name: "Equipment Digital Twin"
    category: jsonb_specific
    intention: |
      Construire un document JSON complet d'un équipement avec ses points,
      stats live, et metadata.
    use_case: "API Digital Twin, export configuration, dashboard"
    parameters:
      - name: EQUIPMENT_ID
        type: string
        description: "ID d'un équipement"
        format:
          sql: "$1"
          cypher: "$equipment_id"
          sparql: "?equipmentId"
        example: "equip_ahu_1"
    relations: [HAS_POINT]
    result_schema:
      columns:
        - {name: digital_twin, type: json, description: "Document JSON complet"}
      structure:
        id: string
        name: string
        type: string
        metadata: object
        capabilities: array
        protocol: object
        points:
          - id: string
            name: string
            quantity: string
            unit: string
            current_value: float
            last_update: timestamp
            stats:
              avg_24h: float
              min_24h: float
              max_24h: float
    paradigm_status:
      P1: {status: VERY_DEGRADED, note: "Multi-JOIN + reconstruction JSON"}
      P2: {status: NATIVE, note: "jsonb_build_object + jsonb_agg + LATERAL"}
      M1: {status: IMPOSSIBLE, note: "Pas de TimescaleDB pour stats live"}
      M2: {status: DEGRADED, note: "Orchestration applicative requise"}
      O2: {status: DEGRADED, note: "CONSTRUCT SPARQL + orchestration"}

  # -------------------------------------------------------------------------
  # GRAPH-NATIVE (Q20-Q23)
  # -------------------------------------------------------------------------

  Q20:
    name: "Shortest HVAC Path"
    category: graph_native
    intention: |
      Trouver le chemin le plus court entre un équipement HVAC source
      et un espace cible.
    use_case: "Diagnostic flux d'air, identification du trajet de distribution"
    parameters:
      - name: EQUIPMENT_ID
        type: string
        description: "ID équipement HVAC source"
        format:
          sql: "$1"
          cypher: "$equipment_id"
          sparql: "?equipmentId"
        example: "equip_ahu_1"
      - name: SPACE_ID
        type: string
        description: "ID espace cible"
        format:
          sql: "$2"
          cypher: "$space_id"
          sparql: "?spaceId"
        example: "space_office_201"
    relations: [FEEDS, SERVES]
    result_schema:
      columns:
        - {name: path_index, type: integer, description: "Position dans le chemin"}
        - {name: node_id, type: string, description: "ID nœud"}
        - {name: node_type, type: string, description: "Type nœud"}
        - {name: node_name, type: string, description: "Nom nœud"}
      order_by: [path_index]
    paradigm_status:
      P1: {status: DEGRADED, note: "CTE récursif explore tout avant filtrage"}
      P2: {status: DEGRADED, note: "CTE récursif explore tout avant filtrage"}
      M1: {status: NATIVE, note: "shortestPath() natif Cypher"}
      M2: {status: NATIVE, note: "shortestPath() natif Cypher"}
      O2: {status: IMPOSSIBLE, note: "No shortestPath in SPARQL, UNION-based workaround too slow"}

  Q21:
    name: "Electrical Resilience"
    category: graph_native
    intention: |
      Pour un équipement critique, identifier tous les chemins d'alimentation
      et les points de défaillance unique (SPOF).
    use_case: "Analyse risque datacenter, planification redondance, audit sécurité électrique"
    parameters:
      - name: EQUIPMENT_ID
        type: string
        description: "ID équipement critique"
        format:
          sql: "$1"
          cypher: "$equipment_id"
          sparql: "?equipmentId"
        example: "equip_server_critical_1"
      - name: SOURCE_TYPE
        type: string
        description: "Type de source d'alimentation"
        format:
          sql: "$2"
          cypher: "$source_type"
          sparql: "?sourceType"
        example: "MainMeter"
        values: ["MainMeter", "UPS"]
    relations: [FEEDS]
    direction: upstream
    result_schema:
      columns:
        - {name: path_id, type: integer, description: "ID du chemin"}
        - {name: path_nodes, type: array, description: "Nœuds du chemin"}
        - {name: path_length, type: integer, description: "Longueur du chemin"}
        - {name: is_spof, type: boolean, description: "Nœud SPOF identifié"}
        - {name: spof_node_id, type: string, description: "ID nœud SPOF si applicable"}
      order_by: [path_length, path_id]
    paradigm_status:
      P1: {status: DEGRADED, note: "CTE récursif exhaustif - explosion combinatoire"}
      P2: {status: DEGRADED, note: "CTE récursif exhaustif - explosion combinatoire"}
      M1: {status: NATIVE, note: "allShortestPaths() + collecte chemins"}
      M2: {status: NATIVE, note: "allShortestPaths() + collecte chemins"}
      O2: {status: IMPOSSIBLE, note: "Non supporté efficacement"}

  Q22:
    name: "Equipment Siblings"
    category: graph_native
    intention: |
      Trouver les équipements "frères" (alimentés par le même parent FEEDS)
      d'un équipement donné.
    use_case: "Identification des équipements impactés par la même source, groupement logique"
    parameters:
      - name: EQUIPMENT_ID
        type: string
        description: "ID d'un équipement"
        format:
          sql: "$1"
          cypher: "$equipment_id"
          sparql: "?equipmentId"
        example: "equip_vav_101"
    relations: [FEEDS]
    result_schema:
      columns:
        - {name: sibling_id, type: string, description: "ID équipement frère"}
        - {name: sibling_name, type: string, description: "Nom équipement frère"}
        - {name: sibling_type, type: string, description: "Type équipement frère"}
        - {name: parent_id, type: string, description: "ID équipement parent commun"}
        - {name: parent_name, type: string, description: "Nom équipement parent"}
      order_by: [parent_id, sibling_id]
    paradigm_status:
      P1: {status: NATIVE, note: "Self-JOIN sur edges fonctionnel"}
      P2: {status: NATIVE, note: "Self-JOIN sur edges fonctionnel"}
      M1: {status: NATIVE, note: "Pattern (a)<-[:FEEDS]-(p)-[:FEEDS]->(b)"}
      M2: {status: NATIVE, note: "Pattern (a)<-[:FEEDS]-(p)-[:FEEDS]->(b)"}
      O2: {status: NATIVE, note: "Double pattern SPARQL"}

  Q23:
    name: "Failure Impact Analysis"
    category: graph_native
    intention: |
      Si cet équipement tombe en panne, quels espaces/équipements sont
      impactés dans un rayon de N hops? Analyse de propagation de défaillance.
    use_case: "Analyse d'impact de panne, planification maintenance, résilience infrastructure"
    parameters:
      - name: EQUIPMENT_ID
        type: string
        description: "ID équipement source de la panne"
        format:
          sql: "$1"
          cypher: "$equipment_id"
          sparql: "?equipmentId"
        example: "eq_mainmeter_1"
      - name: MAX_HOPS
        type: integer
        description: "Nombre maximum de hops"
        format:
          sql: "$2"
          cypher: "$max_hops"
          sparql: "?maxHops"
        example: 3
        default: 3
    relations: [FEEDS, SERVES, POWERS]
    max_depth: "$MAX_HOPS"
    result_schema:
      columns:
        - {name: node_id, type: string, description: "ID nœud impacté"}
        - {name: node_type, type: string, description: "Type nœud (Space/Equipment)"}
        - {name: node_name, type: string, description: "Nom nœud"}
        - {name: hop_distance, type: integer, description: "Distance en hops"}
        - {name: via_relation, type: string, description: "Relation de propagation"}
      order_by: [hop_distance, node_type, node_id]
    paradigm_status:
      P1: {status: NATIVE, note: "CTE récursif avec depth <= N fonctionnel"}
      P2: {status: NATIVE, note: "CTE récursif avec depth <= N fonctionnel"}
      M1: {status: NATIVE, note: "Variable-length path [:REL*1..N]"}
      M2: {status: NATIVE, note: "Variable-length path [:REL*1..N]"}
      O2: {status: DEGRADED, note: "Property path avec limite fixe à 3 hops"}

  # -------------------------------------------------------------------------
  # WRITE WORKLOADS (QW1-QW3)
  # -------------------------------------------------------------------------

  QW1:
    name: "Timeseries Append"
    category: write_workload
    validates: Q35  # Q35 reads what QW1 writes
    intention: |
      Simuler l'ingestion continue de nouvelles mesures IoT.
      Append-only sur la table timeseries (usage middleware/gateway).
    use_case: "Ingestion capteurs, gateway IoT, middleware temps réel"
    parameters:
      - name: POINT_IDS
        type: array_string
        description: "Liste d'IDs de points pour l'insertion batch"
        format:
          sql: "%(point_ids)s"
          cypher: "$point_ids"
        example: "['point_1', 'point_2', 'point_3']"
      - name: TIMESTAMPS
        type: array_timestamp
        description: "Liste de timestamps correspondants"
        format:
          sql: "%(timestamps)s"
          cypher: "$timestamps"
        example: "['2024-01-15T10:00:00Z', '2024-01-15T10:00:01Z']"
      - name: VALUES
        type: array_float
        description: "Liste de valeurs mesurées"
        format:
          sql: "%(values)s"
          cypher: "$values"
        example: "[21.5, 22.0, 21.8]"
    write_mode: append
    result_schema:
      columns:
        - {name: rows_written, type: integer, description: "Nombre de lignes insérées"}
      metrics:
        - rows_written
        - throughput_rows_per_sec
    paradigm_status:
      P1: {status: NATIVE, note: "INSERT INTO ts.timeseries via Timescale partagé"}
      P2: {status: NATIVE, note: "INSERT INTO ts.timeseries via Timescale partagé"}
      M1: {status: NATIVE, note: "UNWIND + MERGE TimeseriesChunk (daily chunking)"}
      M2: {status: NATIVE, note: "INSERT INTO ts.timeseries via Timescale partagé"}
      O2: {status: NATIVE, note: "INSERT INTO ts.timeseries via Timescale partagé"}

  QW2:
    name: "Metadata Update"
    category: write_workload
    validates: Q36  # Q36 reads what QW2 writes
    intention: |
      Mettre à jour des métadonnées/tags sur un équipement ou point.
      Représente les opérations de calibration, tagging, catégorisation.
    use_case: "Calibration capteur, mise à jour tags, modification propriétés"
    parameters:
      - name: NODE_ID
        type: string
        description: "ID du node à mettre à jour"
        format:
          sql: "%(node_id)s"
          cypher: "$node_id"
          sparql: "?nodeId"
        example: "eq_mainmeter_1"
      - name: TAG_KEY
        type: string
        description: "Clé du tag à ajouter/modifier"
        format:
          sql: "%(tag_key)s"
          cypher: "$tag_key"
          sparql: "?tagKey"
        example: "calibration_status"
      - name: TAG_VALUE
        type: string
        description: "Valeur du tag"
        format:
          sql: "%(tag_value)s"
          cypher: "$tag_value"
          sparql: "?tagValue"
        example: "verified"
    write_mode: update
    result_schema:
      columns:
        - {name: rows_updated, type: integer, description: "Nombre de lignes modifiées"}
      metrics:
        - rows_written
    paradigm_status:
      P1: {status: IMPOSSIBLE, note: "Pas de colonne JSONB properties dans P1"}
      P2: {status: NATIVE, note: "UPDATE nodes SET data = jsonb_set(...)"}
      M1: {status: NATIVE, note: "SET node.tag_key = tag_value"}
      M2: {status: NATIVE, note: "SET node.tag_key = tag_value"}
      O2: {status: DEGRADED, note: "DELETE/INSERT triple (pas de vrai UPDATE)"}

  QW3:
    name: "Relation Mutation"
    category: write_workload
    validates: Q37  # Q37 reads what QW3 writes
    intention: |
      Ajouter ou supprimer une relation entre équipements.
      Représente les reconfigurations structurelles rares.
    use_case: "Reconfiguration électrique, déplacement équipement, réorganisation"
    parameters:
      - name: SOURCE_ID
        type: string
        description: "ID nœud source de la relation"
        format:
          sql: "%(source_id)s"
          cypher: "$source_id"
          sparql: "?sourceId"
        example: "eq_mainmeter_1"
      - name: TARGET_ID
        type: string
        description: "ID nœud cible de la relation"
        format:
          sql: "%(target_id)s"
          cypher: "$target_id"
          sparql: "?targetId"
        example: "eq_submeter_new"
      - name: REL_TYPE
        type: string
        description: "Type de relation à créer"
        format:
          sql: "%(rel_type)s"
          cypher: "$rel_type"
          sparql: "?relType"
        example: "FEEDS"
    write_mode: insert
    result_schema:
      columns:
        - {name: rows_inserted, type: integer, description: "Nombre de relations créées"}
      metrics:
        - rows_written
    paradigm_status:
      P1: {status: NATIVE, note: "INSERT INTO edges (source_id, target_id, rel_type)"}
      P2: {status: NATIVE, note: "INSERT INTO edges (source_id, target_id, rel_type)"}
      M1: {status: NATIVE, note: "MERGE (a)-[r:REL_TYPE]->(b)"}
      M2: {status: NATIVE, note: "MERGE (a)-[r:REL_TYPE]->(b)"}
      O2: {status: DEGRADED, note: "INSERT DATA triple (nécessite URI construction)"}

  # -------------------------------------------------------------------------
  # JSONB WRITE WORKLOADS (QW4-QW8) - P2 NATIVE
  # -------------------------------------------------------------------------

  QW4:
    name: "Maintenance Event Append"
    category: jsonb_write
    validates: Q24  # Q24 reads what QW4 writes
    intention: |
      Ajouter un événement de maintenance à l'historique JSONB d'un équipement.
      Crée le champ maintenance_history s'il n'existe pas.
    use_case: "GMAO, suivi maintenance préventive/corrective"
    parameters:
      - name: EQUIPMENT_ID
        type: string
        description: "ID de l'équipement"
        format:
          sql: "%(equipment_id)s"
        example: "eq_ahu_6"
      - name: EVENT
        type: json
        description: "Objet événement de maintenance"
        format:
          sql: "%(event)s"
        example: '{"date": "2024-06-15", "type": "preventive", "technician": "Tech_A"}'
    write_mode: append_array
    jsonb_operations: [jsonb_set, array_append, COALESCE]
    result_schema:
      columns:
        - {name: id, type: string, description: "ID équipement modifié"}
        - {name: event_count, type: integer, description: "Nombre total d'événements"}
    paradigm_status:
      P1: {status: IMPOSSIBLE, note: "Pas de colonne JSONB"}
      P2: {status: NATIVE, note: "jsonb_set + array append avec ||"}
      M1: {status: DEGRADED, note: "Nécessite MAGE pour manipulation liste"}
      M2: {status: DEGRADED, note: "Nécessite MAGE pour manipulation liste"}
      O2: {status: IMPOSSIBLE, note: "RDF n'a pas de structure array native"}

  QW5:
    name: "Deep Calibration Update"
    category: jsonb_write
    validates: Q25  # Q25 reads calibration from QW5
    intention: |
      Mettre à jour les champs de calibration imbriqués d'un point de mesure.
      Préserve les autres champs du sous-objet calibration.
    use_case: "Métrologie, suivi calibration, conformité"
    parameters:
      - name: POINT_ID
        type: string
        description: "ID du point de mesure"
        format:
          sql: "%(point_id)s"
        example: "point_eq_ahu_6_supply_temp"
      - name: CALIBRATION_DATE
        type: date
        description: "Date de la calibration effectuée"
        format:
          sql: "%(calibration_date)s"
        example: "2024-06-01"
      - name: NEXT_DATE
        type: date
        description: "Date de la prochaine calibration"
        format:
          sql: "%(next_date)s"
        example: "2025-06-01"
      - name: TECHNICIAN
        type: string
        description: "Nom du technicien/société"
        format:
          sql: "%(technician)s"
        example: "Calibration_Co"
    write_mode: update_nested
    jsonb_operations: [jsonb_set, nested_path]
    result_schema:
      columns:
        - {name: id, type: string, description: "ID point modifié"}
        - {name: updated_calibration, type: json, description: "Objet calibration mis à jour"}
    paradigm_status:
      P1: {status: IMPOSSIBLE, note: "Pas de colonne JSONB"}
      P2: {status: NATIVE, note: "jsonb_set multi-niveau"}
      M1: {status: NATIVE, note: "SET direct sur propriétés"}
      M2: {status: NATIVE, note: "SET direct sur propriétés"}
      O2: {status: DEGRADED, note: "UPDATE = DELETE + INSERT triple"}

  QW6:
    name: "Metadata Merge"
    category: jsonb_write
    validates: Q25  # Q25 reads firmware info from QW6
    intention: |
      Fusionner un patch JSON dans les metadata existantes d'un équipement.
      Préserve les champs non mentionnés dans le patch.
    use_case: "Mise à jour firmware, campagne bulk update"
    parameters:
      - name: EQUIPMENT_ID
        type: string
        description: "ID de l'équipement"
        format:
          sql: "%(equipment_id)s"
        example: "eq_ahu_7"
      - name: METADATA_PATCH
        type: json
        description: "Objet JSON à fusionner avec metadata"
        format:
          sql: "%(metadata_patch)s"
        example: '{"firmware_version": "3.2.1", "last_update": "2024-06-20"}'
    write_mode: merge
    jsonb_operations: [jsonb_set, merge_operator]
    result_schema:
      columns:
        - {name: id, type: string, description: "ID équipement modifié"}
        - {name: merged_metadata, type: json, description: "Metadata fusionnées"}
    paradigm_status:
      P1: {status: IMPOSSIBLE, note: "Pas de colonne JSONB"}
      P2: {status: NATIVE, note: "Opérateur || pour merge"}
      M1: {status: DEGRADED, note: "SET multiple propriétés"}
      M2: {status: DEGRADED, note: "SET multiple propriétés"}
      O2: {status: IMPOSSIBLE, note: "Pas de merge natif RDF"}

  QW7:
    name: "Add Capability"
    category: jsonb_write
    validates: Q26  # Q26 reads capability distribution after QW7
    intention: |
      Ajouter une capability à un équipement si elle n'existe pas déjà.
      Opération idempotente (pas de doublon).
    use_case: "Upgrade équipement, extension fonctionnelle"
    parameters:
      - name: EQUIPMENT_ID
        type: string
        description: "ID de l'équipement"
        format:
          sql: "%(equipment_id)s"
        example: "eq_ahu_6"
      - name: NEW_CAPABILITY
        type: string
        description: "Capability à ajouter"
        format:
          sql: "%(new_capability)s"
        example: "demand_control_ventilation"
    write_mode: conditional_append
    jsonb_operations: [jsonb_set, jsonb_build_array, containment_check]
    result_schema:
      columns:
        - {name: id, type: string, description: "ID équipement modifié (null si déjà présent)"}
        - {name: updated_capabilities, type: array, description: "Capabilities après ajout"}
    paradigm_status:
      P1: {status: IMPOSSIBLE, note: "Pas de colonne array"}
      P2: {status: NATIVE, note: "Conditional UPDATE avec NOT @>"}
      M1: {status: DEGRADED, note: "Nécessite MAGE ou WHERE NOT IN"}
      M2: {status: DEGRADED, note: "Nécessite MAGE ou WHERE NOT IN"}
      O2: {status: DEGRADED, note: "INSERT IF NOT EXISTS pattern"}

  QW8:
    name: "Remove Metadata Key"
    category: jsonb_write
    validates: Q38  # Q38 reads what QW8 writes (verifies key was removed)
    intention: |
      Supprimer une clé obsolète des metadata d'un équipement.
      Opérateur #- pour suppression par path.
    use_case: "Nettoyage données, migration schéma, RGPD"
    parameters:
      - name: NODE_ID
        type: string
        description: "ID du nœud"
        format:
          sql: "%(node_id)s"
        example: "eq_ahu_6"
      - name: KEY_TO_REMOVE
        type: string
        description: "Clé à supprimer dans metadata"
        format:
          sql: "%(key_to_remove)s"
        example: "legacy_protocol_id"
    write_mode: delete_key
    jsonb_operations: [path_delete, key_exists_check]
    result_schema:
      columns:
        - {name: id, type: string, description: "ID nœud modifié"}
        - {name: cleaned_metadata, type: json, description: "Metadata après suppression"}
    paradigm_status:
      P1: {status: IMPOSSIBLE, note: "Pas de colonne JSONB"}
      P2: {status: NATIVE, note: "Opérateur #- avec path"}
      M1: {status: NATIVE, note: "REMOVE node.property"}
      M2: {status: NATIVE, note: "REMOVE node.property"}
      O2: {status: NATIVE, note: "DELETE DATA triple"}

  # -------------------------------------------------------------------------
  # JSONB VALIDATION QUERIES (Q24-Q26) - Post-Write Enriched Reads
  # -------------------------------------------------------------------------

  Q24:
    name: "Maintenance History"
    category: jsonb_validation
    validates_write: QW4  # Reads what QW4 wrote
    intention: |
      Lire l'historique de maintenance complet d'un équipement avec agrégations.
      Valide les écritures QW4.
    use_case: "Reporting maintenance, analyse coûts, planning"
    parameters:
      - name: EQUIPMENT_ID
        type: string
        description: "ID de l'équipement"
        format:
          sql: "%(equipment_id)s"
        example: "eq_ahu_6"
    jsonb_operations: [jsonb_array_length, array_element_access, jsonb_agg, SUM_from_array]
    result_schema:
      columns:
        - {name: equipment_id, type: string, description: "ID équipement"}
        - {name: name, type: string, description: "Nom équipement"}
        - {name: event_count, type: integer, description: "Nombre d'événements maintenance"}
        - {name: last_event, type: json, description: "Dernier événement complet"}
        - {name: last_event_date, type: date, description: "Date dernier événement"}
        - {name: last_technician, type: string, description: "Dernier technicien"}
        - {name: total_maintenance_cost, type: numeric, description: "Coût total maintenance"}
        - {name: all_parts_replaced, type: array, description: "Toutes pièces remplacées"}
      order_by: []
    paradigm_status:
      P1: {status: IMPOSSIBLE, note: "Pas de données maintenance JSONB"}
      P2: {status: NATIVE, note: "Full JSONB array processing"}
      M1: {status: DEGRADED, note: "Si exporté comme liste propriété"}
      M2: {status: DEGRADED, note: "Si exporté comme liste propriété"}
      O2: {status: IMPOSSIBLE, note: "Pas de structure array RDF"}

  Q25:
    name: "Equipment Audit Trail"
    category: jsonb_validation
    validates_write: [QW5, QW6]  # Reads calibration from QW5, firmware from QW6
    intention: |
      Construire un rapport d'audit complet combinant maintenance, calibration,
      et firmware. Vue 360° post-écritures QW4/5/6.
    use_case: "Audit technique, conformité, reporting direction"
    parameters:
      - name: EQUIPMENT_ID
        type: string
        description: "ID de l'équipement"
        format:
          sql: "%(equipment_id)s"
        example: "eq_ahu_6"
    jsonb_operations: [multi_source_aggregation, nested_access, computed_fields]
    result_schema:
      columns:
        - {name: equipment_id, type: string, description: "ID équipement"}
        - {name: name, type: string, description: "Nom équipement"}
        - {name: equipment_type, type: string, description: "Type équipement"}
        - {name: current_firmware, type: string, description: "Version firmware actuelle"}
        - {name: last_firmware_update, type: date, description: "Date dernière MAJ firmware"}
        - {name: maintenance_events, type: integer, description: "Nombre événements maintenance"}
        - {name: last_maintenance_date, type: date, description: "Date dernière maintenance"}
        - {name: points_calibration_status, type: json, description: "Statut calibration des points"}
        - {name: health_status, type: string, description: "Score santé calculé"}
      order_by: []
    paradigm_status:
      P1: {status: IMPOSSIBLE, note: "Données JSONB requises"}
      P2: {status: NATIVE, note: "Multi-JOIN + JSONB aggregation"}
      M1: {status: DEGRADED, note: "Orchestration applicative"}
      M2: {status: DEGRADED, note: "Orchestration applicative"}
      O2: {status: IMPOSSIBLE, note: "Structure trop complexe"}

  Q26:
    name: "Capability Evolution"
    category: jsonb_validation
    validates_write: QW7  # Reads capability added by QW7
    intention: |
      Analyser la distribution des capabilities par type d'équipement.
      Valide les ajouts via QW7.
    use_case: "Analyse parc, planification upgrades, benchmark"
    parameters:
      - name: DOMAIN
        type: string
        description: "Domaine d'équipements"
        format:
          sql: "%(domain)s"
        example: "HVAC"
    jsonb_operations: [jsonb_object_agg, array_stats, GROUP_BY_jsonb]
    result_schema:
      columns:
        - {name: equipment_type, type: string, description: "Type équipement"}
        - {name: equipment_count, type: integer, description: "Nombre d'équipements"}
        - {name: capabilities_distribution, type: json, description: "Distribution capabilities"}
        - {name: most_common_capability, type: string, description: "Capability la plus fréquente"}
        - {name: avg_capabilities, type: numeric, description: "Moyenne capabilities par équipement"}
      order_by: [equipment_count DESC]
    paradigm_status:
      P1: {status: IMPOSSIBLE, note: "Pas de colonne array capabilities"}
      P2: {status: NATIVE, note: "jsonb_object_agg + array stats"}
      M1: {status: DEGRADED, note: "MAGE pour manipulation listes"}
      M2: {status: DEGRADED, note: "MAGE pour manipulation listes"}
      O2: {status: DEGRADED, note: "Agrégation SPARQL limitée"}

  # -------------------------------------------------------------------------
  # GRAPH-NATIVE EXTENDED (Q27-Q30) - Équilibre benchmark
  # -------------------------------------------------------------------------

  Q27:
    name: "Evacuation Path"
    category: graph_native
    intention: |
      Trouver le chemin d'évacuation le plus court depuis un espace vers
      une sortie de secours, en tenant compte des distances.
    use_case: "Plan d'évacuation, sécurité incendie, accessibilité"
    parameters:
      - name: SPACE_ID
        type: string
        description: "ID de l'espace de départ"
        format:
          sql: "$1"
          cypher: "$space_id"
          sparql: "?spaceId"
        example: "space_office_301"
    relations: [EMERGENCY_EXIT, ACCESSIBLE_FROM]
    result_schema:
      columns:
        - {name: path_index, type: integer, description: "Position dans le chemin"}
        - {name: node_id, type: string, description: "ID nœud"}
        - {name: node_name, type: string, description: "Nom nœud"}
        - {name: total_distance, type: float, description: "Distance cumulée en mètres"}
      order_by: [path_index]
    paradigm_status:
      P1: {status: DEGRADED, note: "CTE récursif avec accumulation poids, non optimal"}
      P2: {status: DEGRADED, note: "CTE récursif avec accumulation poids, non optimal"}
      M1: {status: NATIVE, note: "shortestPath() avec reduce() sur distance"}
      M2: {status: NATIVE, note: "shortestPath() avec reduce() sur distance"}
      O2: {status: IMPOSSIBLE, note: "SPARQL n'a pas de shortestPath pondéré"}

  Q28:
    name: "Tenant Impact Chain"
    category: graph_native
    intention: |
      Si un sous-compteur est coupé, identifier tous les locataires impactés
      via la chaîne: SubMeter → Equipment → Space → Tenant.
    use_case: "Impact coupure électrique sur locataires, facturation, SLA"
    parameters:
      - name: METER_ID
        type: string
        description: "ID du sous-compteur"
        format:
          sql: "$1"
          cypher: "$meter_id"
          sparql: "?meterId"
        example: "eq_submeter_floor2"
    relations: [FEEDS, SERVES, OCCUPIES]
    result_schema:
      columns:
        - {name: tenant_id, type: string, description: "ID locataire impacté"}
        - {name: tenant_name, type: string, description: "Nom locataire"}
        - {name: affected_spaces, type: integer, description: "Nombre d'espaces affectés"}
        - {name: affected_equipment, type: integer, description: "Nombre d'équipements affectés"}
      order_by: [affected_equipment DESC, tenant_id]
    paradigm_status:
      P1: {status: DEGRADED, note: "5 JOINs avec DISTINCT, verbose mais fonctionnel"}
      P2: {status: DEGRADED, note: "5 JOINs avec DISTINCT, verbose mais fonctionnel"}
      M1: {status: NATIVE, note: "Traversée chaîne 5-hop naturelle en Cypher"}
      M2: {status: NATIVE, note: "Traversée chaîne 5-hop naturelle en Cypher"}
      O2: {status: DEGRADED, note: "Property path multi-prédicats complexe"}

  Q29:
    name: "All Power Paths"
    category: graph_native
    intention: |
      Énumérer tous les chemins électriques entre un transformateur et les
      équipements critiques. Utilisé pour analyse de redondance.
    use_case: "Audit résilience électrique, planification maintenance"
    parameters:
      - name: TRANSFORMER_ID
        type: string
        description: "ID du transformateur source"
        format:
          sql: "$1"
          cypher: "$transformer_id"
          sparql: "?transformerId"
        example: "eq_transformer_main"
    relations: [FEEDS]
    filters:
      - property: critical
        value: true
    max_depth: 10
    result_schema:
      columns:
        - {name: path_id, type: integer, description: "ID du chemin"}
        - {name: path_nodes, type: array, description: "Liste des nœuds du chemin"}
        - {name: path_length, type: integer, description: "Longueur du chemin"}
        - {name: target_equipment, type: string, description: "Équipement critique cible"}
      order_by: [path_length, path_id]
    paradigm_status:
      P1: {status: DEGRADED, note: "CTE avec ARRAY accumulation, risque mémoire"}
      P2: {status: DEGRADED, note: "CTE avec ARRAY accumulation, risque mémoire"}
      M1: {status: NATIVE, note: "allPaths() ou pattern variable-length"}
      M2: {status: NATIVE, note: "allPaths() ou pattern variable-length"}
      O2: {status: IMPOSSIBLE, note: "Énumération exhaustive non supportée"}

  Q30:
    name: "Failure Impact Analysis"
    category: graph_native
    intention: |
      Si cet équipement tombe en panne, quels espaces et équipements sont impactés?
      Propagation récursive via FEEDS pour identifier la cascade d'impact.
    use_case: "Analyse d'impact, maintenance préventive, gestion des pannes"
    parameters:
      - name: EQUIPMENT_ID
        type: string
        description: "ID de l'équipement en panne"
        format:
          sql: "$1"
          cypher: "$equipment_id"
          sparql: "?equipmentId"
        example: "eq_mainmeter_4"
    relations: [FEEDS, SERVES, MONITORS, LOCATED_IN]
    result_schema:
      columns:
        - {name: impact_type, type: string, description: "Type d'entité impactée (equipment/space)"}
        - {name: impacted_id, type: string, description: "ID de l'entité impactée"}
        - {name: impacted_name, type: string, description: "Nom de l'entité impactée"}
        - {name: impacted_subtype, type: string, description: "Sous-type (equipment_type ou Space)"}
        - {name: hop_distance, type: integer, description: "Distance en hops depuis l'équipement source"}
        - {name: served_by_equipment, type: string, description: "Équipement qui dessert cet espace (pour spaces)"}
      order_by: [hop_distance, impact_type, impacted_id]
    paradigm_status:
      P1: {status: DEGRADED, note: "CTE récursif avec ARRAY pour éviter cycles"}
      P2: {status: DEGRADED, note: "CTE récursif avec ARRAY pour éviter cycles"}
      M1: {status: NATIVE, note: "Pattern (eq)-[:FEEDS*1..10]->(impacted) naturel"}
      M2: {status: NATIVE, note: "Pattern (eq)-[:FEEDS*1..10]->(impacted) naturel"}
      O2: {status: DEGRADED, note: "Property path SPARQL possible mais verbeux"}

  # -------------------------------------------------------------------------
  # SQL-NATIVE (Q31-Q34) - Avantage SQL
  # -------------------------------------------------------------------------

  Q31:
    name: "Rolling Aggregation"
    category: sql_native
    intention: |
      Calculer des agrégations glissantes (rolling average, percentiles)
      sur les timeseries d'un bâtiment.
    use_case: "Analyse tendances, lissage données, reporting avancé"
    parameters:
      - name: BUILDING_ID
        type: string
        description: "ID du bâtiment"
        format:
          sql: "$1"
          cypher: "$building_id"
          sparql: "?buildingId"
        example: "building_hq_1"
      - name: DATE_START
        type: timestamp
        format:
          sql: "$2"
          cypher: "$date_start"
        example: "2024-01-01T00:00:00Z"
      - name: DATE_END
        type: timestamp
        format:
          sql: "$3"
          cypher: "$date_end"
        example: "2024-01-31T23:59:59Z"
    result_schema:
      columns:
        - {name: point_id, type: string, description: "ID point"}
        - {name: time_bucket, type: timestamp, description: "Bucket temporel"}
        - {name: rolling_avg, type: float, description: "Moyenne glissante 6h"}
        - {name: p95, type: float, description: "95e percentile"}
        - {name: stddev, type: float, description: "Écart-type"}
      order_by: [point_id, time_bucket]
    paradigm_status:
      P1: {status: NATIVE, note: "Window functions PostgreSQL optimisées"}
      P2: {status: NATIVE, note: "Window functions PostgreSQL optimisées"}
      M1: {status: DEGRADED, note: "Pas de window functions, UNWIND + collect"}
      M2: {status: NATIVE, note: "Via TimescaleDB"}
      O2: {status: DEGRADED, note: "SPARQL n'a pas de window functions"}

  Q32:
    name: "JSON Schema Validation"
    category: sql_native
    intention: |
      Valider la structure JSONB des équipements HVAC: vérifier présence
      des champs protocol, metadata, et leur type.
    use_case: "Audit qualité données, validation import, conformité schéma"
    parameters:
      - name: DOMAIN
        type: string
        description: "Domaine d'équipements à valider"
        format:
          sql: "$1"
          cypher: "$domain"
        example: "HVAC"
    jsonb_operations: [jsonb_typeof, key_exists, containment]
    result_schema:
      columns:
        - {name: equipment_id, type: string, description: "ID équipement"}
        - {name: name, type: string, description: "Nom équipement"}
        - {name: schema_status, type: string, description: "valid/invalid"}
        - {name: missing_fields, type: array, description: "Champs manquants"}
      order_by: [schema_status, equipment_id]
    paradigm_status:
      P1: {status: IMPOSSIBLE, note: "Pas de colonne JSONB"}
      P2: {status: NATIVE, note: "Opérateurs JSONB: ?, @>, jsonb_typeof"}
      M1: {status: DEGRADED, note: "Pas d'opérateurs JSON natifs en Cypher"}
      M2: {status: DEGRADED, note: "Pas d'opérateurs JSON natifs en Cypher"}
      O2: {status: IMPOSSIBLE, note: "RDF n'a pas de validation schéma inline"}

  Q33:
    name: "Latest Value per Space"
    category: sql_native
    intention: |
      Pour chaque espace d'un bâtiment, récupérer la dernière valeur de
      chaque point de mesure via LATERAL JOIN efficace.
    use_case: "Dashboard temps réel, vue synthétique, API live"
    parameters:
      - name: BUILDING_ID
        type: string
        description: "ID du bâtiment"
        format:
          sql: "$1"
          cypher: "$building_id"
        example: "building_hq_1"
    result_schema:
      columns:
        - {name: space_id, type: string, description: "ID espace"}
        - {name: space_name, type: string, description: "Nom espace"}
        - {name: point_id, type: string, description: "ID point"}
        - {name: quantity, type: string, description: "Grandeur mesurée"}
        - {name: last_value, type: float, description: "Dernière valeur"}
        - {name: last_time, type: timestamp, description: "Timestamp dernière mesure"}
      order_by: [space_id, point_id]
    paradigm_status:
      P1: {status: NATIVE, note: "LATERAL JOIN optimisé"}
      P2: {status: NATIVE, note: "LATERAL JOIN optimisé"}
      M1: {status: IMPOSSIBLE, note: "Cypher n'a pas de LATERAL, pas de TS"}
      M2: {status: DEGRADED, note: "Orchestration Cypher → SQL requise"}
      O2: {status: IMPOSSIBLE, note: "SPARQL n'a pas de subquery corrélée efficace"}

  Q34:
    name: "Materialized Energy Summary"
    category: sql_native
    intention: |
      Lire depuis une vue matérialisée pré-calculée les agrégats énergie
      par jour et par bâtiment. Test de pattern cache/refresh.
    use_case: "Dashboard direction, reporting, performance requêtes fréquentes"
    parameters:
      - name: BUILDING_ID
        type: string
        description: "ID du bâtiment"
        format:
          sql: "$1"
          cypher: "$building_id"
        example: "building_hq_1"
      - name: DATE_START
        type: date
        format:
          sql: "$2"
        example: "2024-01-01"
      - name: DATE_END
        type: date
        format:
          sql: "$3"
        example: "2024-01-31"
    result_schema:
      columns:
        - {name: building_id, type: string, description: "ID bâtiment"}
        - {name: day, type: date, description: "Jour"}
        - {name: total_energy_kwh, type: float, description: "Énergie totale kWh"}
        - {name: peak_power_kw, type: float, description: "Pic de puissance kW"}
        - {name: meter_count, type: integer, description: "Nombre de compteurs"}
      order_by: [day]
    paradigm_status:
      P1: {status: NATIVE, note: "Vues matérialisées PostgreSQL"}
      P2: {status: NATIVE, note: "Vues matérialisées PostgreSQL"}
      M1: {status: IMPOSSIBLE, note: "Memgraph n'a pas de vues matérialisées"}
      M2: {status: DEGRADED, note: "Via TimescaleDB continuous aggregates"}
      O2: {status: IMPOSSIBLE, note: "SPARQL n'a pas de vues matérialisées"}

  # -------------------------------------------------------------------------
  # WRITE VALIDATION QUERIES (Q35-Q38) - Post-Write Checks
  # -------------------------------------------------------------------------

  Q35:
    name: "Validate Timeseries Append"
    category: write_validation
    validates_write: QW1  # Reads what QW1 wrote
    intention: |
      Valider que les données timeseries ont été correctement ajoutées par QW1.
      Vérifie les timestamps et valeurs dans le chunk journalier.
    use_case: "Validation ingestion IoT, audit qualité données"
    parameters:
      - name: POINT_ID
        type: string
        description: "ID du point dont on vérifie les timeseries"
        format:
          sql: "%(point_id)s"
          cypher: "$point_id"
        example: "point_temp_101"
      - name: REFERENCE_DATE
        type: date
        description: "Date de référence pour filtrer le chunk"
        format:
          sql: "%(reference_date)s"
          cypher: "$reference_date"
        example: "2024-06-01"
    result_schema:
      columns:
        - {name: point_id, type: string, description: "ID du point"}
        - {name: chunk_date, type: date, description: "Date du chunk"}
        - {name: timestamp_count, type: integer, description: "Nombre de timestamps"}
        - {name: value_count, type: integer, description: "Nombre de valeurs"}
        - {name: last_timestamps, type: array, description: "Derniers timestamps ajoutés"}
        - {name: last_values, type: array, description: "Dernières valeurs ajoutées"}
      order_by: []
    paradigm_status:
      P1: {status: NATIVE, note: "SELECT sur ts.timeseries avec DATE filter"}
      P2: {status: NATIVE, note: "SELECT sur ts.timeseries avec DATE filter"}
      M1: {status: NATIVE, note: "MATCH TimeseriesChunk avec date filter"}
      M2: {status: NATIVE, note: "SELECT sur ts.timeseries via Timescale"}
      O2: {status: NATIVE, note: "SELECT sur ts.timeseries via Timescale"}

  Q36:
    name: "Validate Metadata Tag Update"
    category: write_validation
    validates_write: QW2  # Reads what QW2 wrote
    intention: |
      Valider que le tag custom_tag a été correctement mis à jour par QW2.
      Vérifie la valeur de la propriété après l'écriture.
    use_case: "Validation tagging, audit modifications"
    parameters:
      - name: NODE_ID
        type: string
        description: "ID du nœud dont on vérifie le tag"
        format:
          sql: "%(node_id)s"
          cypher: "$node_id"
        example: "eq_mainmeter_1"
    result_schema:
      columns:
        - {name: node_id, type: string, description: "ID du nœud"}
        - {name: node_name, type: string, description: "Nom du nœud"}
        - {name: custom_tag, type: string, description: "Valeur du tag mis à jour"}
        - {name: node_type, type: string, description: "Type/labels du nœud"}
      order_by: []
    paradigm_status:
      P1: {status: IMPOSSIBLE, note: "QW2 non supporté en P1 (pas de JSONB)"}
      P2: {status: NATIVE, note: "SELECT data->>'calibration_status'"}
      M1: {status: NATIVE, note: "MATCH + RETURN n.custom_tag"}
      M2: {status: NATIVE, note: "MATCH + RETURN n.custom_tag"}
      O2: {status: DEGRADED, note: "Query triple custom_tag"}

  Q37:
    name: "Validate Relation Mutation"
    category: write_validation
    validates_write: QW3  # Reads what QW3 wrote
    intention: |
      Valider que la relation FEEDS a été créée entre source et target par QW3.
      Vérifie l'existence et le type de la relation.
    use_case: "Validation reconfiguration, audit relations"
    parameters:
      - name: SOURCE_ID
        type: string
        description: "ID du nœud source de la relation"
        format:
          sql: "%(source_id)s"
          cypher: "$source_id"
        example: "eq_mainmeter_1"
      - name: TARGET_ID
        type: string
        description: "ID du nœud cible de la relation"
        format:
          sql: "%(target_id)s"
          cypher: "$target_id"
        example: "eq_submeter_new"
    result_schema:
      columns:
        - {name: source_id, type: string, description: "ID source"}
        - {name: source_name, type: string, description: "Nom source"}
        - {name: rel_type, type: string, description: "Type de relation"}
        - {name: target_id, type: string, description: "ID cible"}
        - {name: target_name, type: string, description: "Nom cible"}
      order_by: []
    paradigm_status:
      P1: {status: NATIVE, note: "SELECT FROM edges avec JOIN nodes"}
      P2: {status: NATIVE, note: "SELECT FROM edges avec JOIN nodes"}
      M1: {status: NATIVE, note: "MATCH (a)-[r:FEEDS]->(b)"}
      M2: {status: NATIVE, note: "MATCH (a)-[r:FEEDS]->(b)"}
      O2: {status: NATIVE, note: "SELECT pattern SPARQL"}

  Q38:
    name: "Validate Property Removal"
    category: write_validation
    validates_write: QW8  # Reads what QW8 removed
    intention: |
      Valider que la propriété custom_tag a été supprimée par QW8.
      Vérifie l'absence de la propriété après la suppression.
    use_case: "Validation nettoyage, audit suppressions"
    parameters:
      - name: NODE_ID
        type: string
        description: "ID du nœud dont on vérifie la suppression"
        format:
          sql: "%(node_id)s"
          cypher: "$node_id"
        example: "eq_ahu_6"
      - name: KEY_TO_REMOVE
        type: string
        description: "Clé qui devait être supprimée"
        format:
          sql: "%(key_to_remove)s"
          cypher: "$key_to_remove"
        example: "legacy_protocol_id"
    result_schema:
      columns:
        - {name: node_id, type: string, description: "ID du nœud"}
        - {name: node_name, type: string, description: "Nom du nœud"}
        - {name: tag_removed, type: boolean, description: "True si la clé a été supprimée"}
        - {name: remaining_keys, type: array, description: "Clés restantes dans metadata"}
      order_by: []
    paradigm_status:
      P1: {status: IMPOSSIBLE, note: "QW8 non supporté en P1 (pas de JSONB)"}
      P2: {status: NATIVE, note: "NOT (data->'metadata' ? key)"}
      M1: {status: NATIVE, note: "n.custom_tag IS NULL"}
      M2: {status: NATIVE, note: "n.custom_tag IS NULL"}
      O2: {status: NATIVE, note: "NOT EXISTS triple check"}

# ===========================================================================
# PARAMETER FORMATS PAR PARADIGME
# ===========================================================================
parameter_formats:
  pattern_match:
    SQL: "LIKE 'prefix_%'"
    Cypher: "STARTS WITH 'prefix_'"
    SPARQL: "STRSTARTS(?var, 'prefix_')"
  date_format:
    SQL: "ISO 8601 string (YYYY-MM-DDTHH:MM:SSZ)"
    Cypher: "Unix timestamp (ms) ou datetime()"
    SPARQL: "xsd:dateTime"
  array_contains:
    SQL_P1: "Non supporté"
    SQL_P2: "data->'array' @> '[\"value\"]'"
    Cypher: "value IN node.array"
    SPARQL: "FILTER(?val = 'value')"
  json_path:
    SQL_P1: "Non supporté"
    SQL_P2: "data->'key1'->'key2'->>'value'"
    Cypher: "node.key1.key2.value (si exporté)"
    SPARQL: "Triple dédié"
  recursive_depth:
    SQL: "WITH RECURSIVE ... WHERE depth <= N"
    Cypher: "*1..N"
    SPARQL: "property path avec limite"

# ===========================================================================
# STATUS LEGEND
# ===========================================================================
status_legend:
  NATIVE: "Supporté nativement avec performance optimale"
  DEGRADED: "Possible mais avec limitations ou performance réduite"
  VERY_DEGRADED: "Possible mais complexité élevée et performance faible"
  IMPOSSIBLE: "Non supporté par le paradigme"
