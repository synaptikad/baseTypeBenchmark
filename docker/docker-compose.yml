services:
  timescale:
    image: timescale/timescaledb-ha:pg16
    container_name: benchmark-timescale
    ports:
      - "5432:5432"
    command:
      - postgres
      - "-c"
      - "max_wal_size=4GB"
      - "-c"
      - "checkpoint_timeout=30min"
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-benchmark}
    volumes:
      - timescaledb_data:/home/postgres/pgdata  # timescaledb-ha uses this path
      - ${BTB_DATA_DIR:-.}:/data:ro  # Mount data directory for fast server-side COPY
    mem_limit: ${MEMORY_LIMIT:-8g}
    memswap_limit: ${MEMORY_LIMIT:-8g}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-benchmark}"]
      interval: 10s
      timeout: 5s
      retries: 5

  memgraph:
    # memgraph-mage inclut MAGE (équivalent APOC pour Neo4j)
    image: memgraph/memgraph-mage:latest
    container_name: benchmark-memgraph
    ports:
      - "7688:7687"
    volumes:
      - memgraph_data:/var/lib/memgraph
    mem_limit: ${MEMORY_LIMIT:-8g}
    memswap_limit: ${MEMORY_LIMIT:-8g}
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/7687'" ]
      interval: 10s
      timeout: 5s
      retries: 5

  oxigraph:
    image: oxigraph/oxigraph:latest
    container_name: benchmark-oxigraph
    ports:
      - "7878:7878"
    command: ["serve", "--location", "/data", "--bind", "0.0.0.0:7878"]
    volumes:
      - oxigraph_data:/data
    mem_limit: ${MEMORY_LIMIT:-8g}
    memswap_limit: ${MEMORY_LIMIT:-8g}
    healthcheck:
      # Note: Oxigraph uses distroless image (no wget/curl)
      # Use oxigraph CLI to verify store is accessible
      test: ["CMD", "/usr/local/bin/oxigraph", "query", "--location", "/data", "--query", "ASK {}", "--results-format", "json"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  timescaledb_data:
  memgraph_data:
  oxigraph_data:
