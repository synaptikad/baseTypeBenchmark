services:
  timescale:
    image: timescale/timescaledb-ha:pg16
    container_name: benchmark-timescale
    ports:
      - "127.0.0.1:5432:5432"  # Only localhost, not exposed to internet
    command:
      - postgres
      - "-c"
      - "max_wal_size=4GB"
      - "-c"
      - "checkpoint_timeout=30min"
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-benchmark}
    volumes:
      - timescaledb_data:/home/postgres/pgdata  # timescaledb-ha uses this path
      - ${BTB_DATA_DIR:-.}:/data:ro  # Mount data directory for fast server-side COPY
    # No mem_limit here - containers start without RAM limit for data loading
    # RAM limits are applied dynamically by the benchmark code during calibration/run
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-benchmark}"]
      interval: 10s
      timeout: 5s
      retries: 5

  memgraph:
    # memgraph-mage inclut MAGE (équivalent APOC pour Neo4j)
    image: memgraph/memgraph-mage:latest
    container_name: benchmark-memgraph
    ports:
      - "127.0.0.1:7688:7687"  # Only localhost
    volumes:
      - memgraph_data:/var/lib/memgraph
    # No mem_limit here - containers start without RAM limit for data loading
    # RAM limits are applied dynamically by the benchmark code during calibration/run
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/7687'" ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  timescaledb_data:
  memgraph_data:
